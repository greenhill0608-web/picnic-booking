name: Unconfirmed booking reminder

# 每小時檢查一次：客人線上新預約，店家在後台超過 8 小時還沒按「確認」，就寄一封 email 列出還沒確認的預約；
# 之後每隔 8 小時再提醒一次，直到你在後台按下「確認」為止。
# 需要的設定與 notify.yml 相同：Variables 的 API_URL；Secrets 的 NOTIFY_SECRET、NOTIFY_TO、SMTP_USER、SMTP_PASS。
on:
  schedule:
    - cron: "17 * * * *"      # 每小時第 17 分（GitHub 排程可能延遲）
  workflow_dispatch:
    inputs:
      hours:
        description: "超過幾小時未確認才提醒（留空 = 8）"
        required: false

permissions:
  contents: read

concurrency:
  group: unack-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        env:
          API_URL: ${{ vars.API_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IN_HOURS: ${{ github.event.inputs.hours }}
        run: |
          python3 - <<'PY'
          import json, os, re, smtplib, sys, urllib.request
          from email.message import EmailMessage

          # 注意：repo 是公開的，Actions 記錄任何人看得到，所以這裡只印筆數，不印姓名、電話、email。
          to = [x.strip() for x in os.environ.get("NOTIFY_TO", "").split(",") if x.strip()]
          user, pw = os.environ.get("SMTP_USER", ""), os.environ.get("SMTP_PASS", "")
          api, secret = os.environ.get("API_URL", "").rstrip("/"), os.environ.get("NOTIFY_SECRET", "")
          if not (to and user and pw and api and secret):
              print("::warning::尚未設定 API_URL / NOTIFY_SECRET / NOTIFY_TO / SMTP_USER / SMTP_PASS，略過"); sys.exit(0)
          hours = (os.environ.get("IN_HOURS") or "").strip()
          hours = hours if re.fullmatch(r"\d{1,3}", hours) else "8"

          def call(path, data=None):
              h = {"X-Notify-Secret": secret, "User-Agent": "picnic-unack"}
              if data is not None: h["Content-Type"] = "application/json"
              rq = urllib.request.Request(api + path, data=json.dumps(data).encode() if data is not None else None, headers=h)
              return json.load(urllib.request.urlopen(rq, timeout=30))

          try:
              d = call("/api/internal/unack?hours=" + hours)
          except Exception as ex:
              print("::error::向後端取得資料失敗：", type(ex).__name__); sys.exit(1)
          bks = d.get("bookings") or []
          if not bks:
              print("沒有需要提醒的未確認預約"); sys.exit(0)

          sess = {s["id"]: s["label"] for s in d.get("sessions", [])}
          repo = os.environ.get("GITHUB_REPOSITORY", "/")
          owner_, name_ = repo.split("/", 1)
          site = f"https://{owner_}.github.io/" + ("" if name_.lower() == f"{owner_}.github.io".lower() else name_ + "/")
          lines = [f"以下 {len(bks)} 筆新預約超過 {hours} 小時還沒有在後台按「確認」：", ""]
          for b in bks:
              lines.append(f"．{b.get('date', '')} {sess.get(b.get('session'), '')}　{b.get('name', '')}　大人 {b.get('adults', 0)}・孩童 {b.get('children', 0)}　代號 {b.get('code', '')}")
          lines += ["", f"請登入預約網站後台，在最上方的黃色區塊按「確認」：{site}", f"（沒按確認的話，每隔 {hours} 小時會再提醒一次）"]
          msg = EmailMessage()
          msg["Subject"] = f"【提醒】還有 {len(bks)} 筆新預約尚未確認"
          msg["From"], msg["To"] = user, ", ".join(to)
          msg.set_content("\n".join(lines))
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
              s.login(user, pw); s.send_message(msg)
          try: call("/api/internal/unack-mark", {"ids": [b["id"] for b in bks if isinstance(b.get("id"), str)]})
          except Exception as ex: print("::warning::標記失敗（下次執行可能重複提醒）：", type(ex).__name__)
          print(f"已寄出未確認提醒，共 {len(bks)} 筆")
          PY
